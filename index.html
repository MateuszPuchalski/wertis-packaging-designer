<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WERTIS Packaging Designer</title>
  <link rel="icon" href="assets/brand/wertis-logo.svg">
  <link rel="stylesheet" href="styles.css">
  <!-- PDF export: jsPDF and svg2pdf (vendored, MIT). -->
  <script src="vendor/jspdf/jspdf.umd.min.js" defer></script>
  <script src="vendor/svg2pdf/svg2pdf.umd.min.js" defer></script>
  <!-- The 3D tab: three.js is imported as "three" (OrbitControls does the same). -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <!-- The top bar's buttons come from src/ui/topbar.js; the texts from src/i18n/. -->
  <header class="topbar">
    <div class="brand">
      <img src="assets/brand/wertis-logo.svg" alt="WERTIS" height="24">
      <span data-i18n="top.product">Packaging Designer</span>
    </div>
  </header>
  <main class="layout">
    <aside id="sidebar" class="panel" data-i18n-aria="side.label" aria-label="Settings"></aside>
    <section id="stage" class="stage" data-i18n-aria="stage.label" aria-label="Preview"></section>
    <aside id="inspector" class="panel right" data-i18n-aria="insp.label" aria-label="Selected element"></aside>
  </main>
  <div id="boot-status" class="boot" data-i18n="boot.loading">Loading the fonts and your last design…</div>
</body>
</html>
